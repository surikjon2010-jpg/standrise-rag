name: Build StandriseRage
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make build-essential clang cmake libssl-dev libplist-dev libplist++-dev libgit2-dev libcurl4-openssl-dev zlib1g-dev pkg-config wget unzip

      - name: Install Theos (Zip)
        run: |
          export THEOS=$HOME/theos
          mkdir -p $THEOS
          cd $THEOS
          
          wget -q https://github.com/theos/theos/archive/refs/heads/master.zip
          unzip -q master.zip
          mv theos-master/* .
          rm -rf theos-master master.zip
          
          wget -q https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip -q master.zip
          mv sdks-master/* sdks/
          rm -rf sdks-master master.zip
          
          # ФИКС: Инициализируем git репозиторий и добавляем origin
          git init
          git remote add origin https://github.com/theos/theos.git
          git fetch --depth 1
          git checkout -f master
          
          # Теперь обновление пройдет успешно
          $THEOS/bin/update-theos
          
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Build dylib
        run: |
          make clean || true
          make

      - name: Copy file to root
        run: |
          find . -name "StandriseRage.dylib" -exec cp {} ./StandriseRage.dylib \;
          ls -la StandriseRage.dylib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StandriseRage-dylib
          path: StandriseRage.dylib
