name: Build StandriseRage
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make build-essential clang cmake libssl-dev libplist-dev libplist++-dev libgit2-dev libcurl4-openssl-dev zlib1g-dev pkg-config wget unzip

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Get Dobby Prebuilt
        run: |
          # Клонируем репозиторий с готовой библиотекой
          git clone https://github.com/DeV144/HuyJIT-ModMenu.git --depth 1
          
          # Копируем файлы в нашу папку Dobby
          mkdir -p Dobby/include
          cp HuyJIT-ModMenu/Dobby/libdobby.a Dobby/libdobby.a
          cp HuyJIT-ModMenu/Dobby/include/dobby.h Dobby/include/dobby.h
          
          # Проверяем, что файл на месте
          ls -la Dobby/libdobby.a

      - name: Build dylib
        run: |
          make clean || true
          make

      - uses: actions/upload-artifact@v4
        with:
          name: StandriseRage-dylib
          path: .theos/obj/arm64/StandriseRage.dylib
