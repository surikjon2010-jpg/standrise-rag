name: Build StandriseRage
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make build-essential clang cmake libssl-dev libplist-dev libplist++-dev libgit2-dev libcurl4-openssl-dev zlib1g-dev pkg-config wget unzip

      - name: Install Theos (Manual)
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          
          # Скачиваем тулчейн (компилятор)
          wget -q https://github.com/theos/toolchain/releases/download/linux-1.0.0/toolchain-linux-x86_64.tar.xz
          tar -xf toolchain-linux-x86_64.tar.xz -C $THEOS
          
          # Скачиваем iOS SDK
          cd $THEOS/sdks
          git clone --depth 1 https://github.com/theos/sdks.git tmp
          mv tmp/* . && rm -rf tmp
          
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Build dylib
        run: |
          make clean || true
          make

      - name: Copy file to root
        run: |
          find . -name "StandriseRage.dylib" -exec cp {} ./StandriseRage.dylib \;
          ls -la StandriseRage.dylib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StandriseRage-dylib
          path: StandriseRage.dylib
