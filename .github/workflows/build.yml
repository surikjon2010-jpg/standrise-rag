name: Build StandriseRage
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make build-essential clang cmake libssl-dev libplist-dev libplist++-dev libgit2-dev libcurl4-openssl-dev zlib1g-dev pkg-config wget unzip

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Build Dobby with clang target
        run: |
          git clone https://github.com/jmpews/Dobby.git --depth 1
          cd Dobby
          
          # Собираем напрямую через Makefile Dobby, задавая target для iOS
          make CC="$THEOS/toolchain/linux/iphone/bin/clang -target arm64-apple-ios15.0 -isysroot $THEOS/sdks/iPhoneOS16.5.sdk" \
               CXX="$THEOS/toolchain/linux/iphone/bin/clang++ -target arm64-apple-ios15.0 -isysroot $THEOS/sdks/iPhoneOS16.5.sdk" \
               AR=/usr/bin/ar RANLIB=/usr/bin/ranlib -j4 || true
               
          # Ищем, куда он положил libdobby.a и копируем
          find . -name "libdobby.a" -exec cp {} ../Dobby/libdobby.a \;
          mkdir -p ../Dobby/include
          cp include/dobby.h ../Dobby/include/dobby.h

      - name: Build dylib
        run: |
          make clean || true
          make

      - uses: actions/upload-artifact@v4
        with:
          name: StandriseRage-dylib
          path: .theos/obj/arm64/StandriseRage.dylib
