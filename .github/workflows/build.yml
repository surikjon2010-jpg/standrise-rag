name: Build StandriseRage
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make build-essential clang cmake libssl-dev libplist-dev libplist++-dev libgit2-dev libcurl4-openssl-dev zlib1g-dev pkg-config wget unzip

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Build Dobby (Manual CMake)
        run: |
          git clone https://github.com/jmpews/Dobby.git --depth 1
          cd Dobby
          mkdir build_for_ios_arm64 && cd build_for_ios_arm64
          # Используем официальные флаги из документации Dobby для iOS
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=../cmake/ios.toolchain.cmake \
            -DPLATFORM=OS64 \
            -DARCHS="arm64" \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DENABLE_BITCODE=0 \
            -DENABLE_ARC=0 \
            -DENABLE_VISIBILITY=1 \
            -DDEPLOYMENT_TARGET=15.0 \
            -DDynamicBinaryInstrument=ON \
            -DNearBranch=ON \
            -DPlugin.SymbolResolver=ON \
            -DPlugin.Darwin.HideLibrary=ON \
            -DPlugin.Darwin.ObjectiveC=ON
          make -j4
          
          # Копируем результаты в корень проекта для Theos
          mkdir -p ../../Dobby/include
          cp libdobby.a ../../Dobby/libdobby.a
          cp ../include/dobby.h ../../Dobby/include/dobby.h

      - name: Build dylib
        run: |
          make clean || true
          make

      - uses: actions/upload-artifact@v4
        with:
          name: StandriseRage-dylib
          path: .theos/obj/arm64/StandriseRage.dylib
