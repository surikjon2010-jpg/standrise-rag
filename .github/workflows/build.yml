name: Build StandriseRage
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make build-essential clang cmake libssl-dev libplist-dev libplist++-dev libgit2-dev libcurl4-openssl-dev zlib1g-dev pkg-config wget unzip

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Build Dobby Manually
        run: |
          git clone https://github.com/jmpews/Dobby.git --depth 1
          cd Dobby
          
          # Создаем простой Makefile для сборки Dobby
          cat << 'EOF' > Makefile
          CC = $(THEOS)/toolchain/linux/iphone/bin/clang
          AR = /usr/bin/ar
          CFLAGS = -arch arm64 -isysroot $(THEOS)/sdks/iPhoneOS16.5.sdk -Iinclude -Isource -Ibuiltin-plugin -fPIC -O2
          
          SRC = $(wildcard source/*.c) $(wildcard source/*.cc) $(wildcard source/*.cpp)
          OBJ = $(SRC:.c=.o)
          OBJ := $(OBJ:.cc=.o)
          OBJ := $(OBJ:.cpp=.o)
          
          all: libdobby.a
          
          libdobby.a: $(OBJ)
          	$(AR) rcs $@ $^
          
          %.o: %.c
          	$(CC) $(CFLAGS) -c $< -o $@
          	
          %.o: %.cc
          	$(CC) $(CFLAGS) -c $< -o $@
          
          %.o: %.cpp
          	$(CC) $(CFLAGS) -c $< -o $@
          EOF
          
          make
          
          mkdir -p ../Dobby/include
          cp libdobby.a ../Dobby/libdobby.a
          cp include/dobby.h ../Dobby/include/dobby.h

      - name: Build dylib
        run: |
          make clean || true
          make

      - uses: actions/upload-artifact@v4
        with:
          name: StandriseRage-dylib
          path: .theos/obj/arm64/StandriseRage.dylib
