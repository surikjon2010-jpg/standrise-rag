name: Build StandriseRage
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make build-essential clang cmake libssl-dev libplist-dev libplist++-dev libgit2-dev libcurl4-openssl-dev zlib1g-dev pkg-config wget unzip

      - name: Install Theos (Manual without submodules)
        run: |
          export THEOS=$HOME/theos
          git clone https://github.com/theos/theos.git $THEOS
          
          # Скачиваем нужные подмодули вручную архивом
          cd $THEOS
          wget -q https://github.com/theos/headers/archive/refs/heads/master.zip
          unzip -q master.zip
          mv headers-master vendor/include
          rm -rf master.zip
          
          wget -q https://github.com/theos/lib/archive/refs/heads/master.zip
          unzip -q master.zip
          mv lib-master vendor/lib
          rm -rf master.zip

          wget -q https://github.com/theos/logos/archive/refs/heads/master.zip
          unzip -q master.zip
          mv logos-master vendor/logos
          rm -rf master.zip

          # Скачиваем SDK
          mkdir -p sdks
          cd sdks
          wget -q https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip -q master.zip
          mv sdks-master/* .
          rm -rf sdks-master master.zip
          
          # Качаем тулчейн
          mkdir -p $THEOS/toolchain
          cd $THEOS/toolchain
          wget -q https://github.com/theos/toolchain/releases/download/linux-1.0.0/toolchain-linux-x86_64.tar.xz
          tar -xf toolchain-linux-x86_64.tar.xz
          rm toolchain-linux-x86_64.tar.xz
          
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Build dylib
        run: |
          make clean || true
          make

      - name: Copy file to root
        run: |
          find . -name "StandriseRage.dylib" -exec cp {} ./StandriseRage.dylib \;
          ls -la StandriseRage.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: StandriseRage-dylib
          path: StandriseRage.dylib
