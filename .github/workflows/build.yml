name: Build StandriseRage
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make build-essential clang cmake libssl-dev libplist-dev libplist++-dev libgit2-dev libcurl4-openssl-dev zlib1g-dev pkg-config wget unzip

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Clone Dobby Source
        run: |
          # Клонируем исходники Dobby
          git clone https://github.com/jmpews/Dobby.git --depth 1
          mkdir -p Dobby/include
          # Копируем заголовочный файл
          cp Dobby/include/dobby.h Dobby/include/
          # Копируем файлы исходного кода в папку Dobby для сборки
          mkdir -p Dobby/src
          cp -r Dobby/source/* Dobby/src/
          cp -r Dobby/builtin-plugin Dobby/src/
          # Создаем простой Makefile для сборки Dobby как статической библиотеки
          cat << 'EOF' > Dobby/Makefile
          SRC = $(wildcard src/*.cc) $(wildcard src/*.c) $(wildcard src/*.cpp)
          OBJ = $(SRC:.cc=.o)
          OBJ := $(OBJ:.c=.o)
          OBJ := $(OBJ:.cpp=.o)
          CFLAGS = -Iinclude -Isrc -fPIC -O2
          all: libdobby.a
          libdobby.a: $(OBJ)
          	ar rcs $@ $^
          %.o: %.cc
          	$(CXX) $(CFLAGS) -c $< -o $@
          %.o: %.c
          	$(CC) $(CFLAGS) -c $< -o $@
          %.o: %.cpp
          	$(CXX) $(CFLAGS) -c $< -o $@
          clean:
          	rm -f $(OBJ) libdobby.a
          EOF
          cd Dobby
          make

      - name: Build dylib
        run: |
          # Указываем Theos, где лежит собранная библиотека
          export LDFLAGS="-L./Dobby -ldobby"
          make clean || true
          make

      - uses: actions/upload-artifact@v4
        with:
          name: StandriseRage-dylib
          path: .theos/obj/arm64/StandriseRage.dylibх
