name: Build StandriseRage
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make clang cmake libssl-dev libplist-dev libplist++-dev libgit2-dev libcurl4-openssl-dev zlib1g-dev pkg-config

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: iOS SDK and Toolchain
        run: |
          # Скачиваем актуальный тулчейн от сообщества
          wget https://github.com/L1ghtmann/theos-toolchain/releases/download/linux-1.0.0/toolchain-linux-x86_64.tar.xz
          tar -xf toolchain-linux-x86_64.tar.xz -C $THEOS
          
          # Скачиваем SDK
          cd $THEOS/sdks
          git clone --depth 1 https://github.com/theos/sdks.git tmp
          mv tmp/* . && rm -rf tmp

      - name: Download Dobby
        run: |
          wget https://github.com/jmpews/Dobby/releases/download/v1.0.0/dobby-ios-arm64.a -O Dobby/libdobby.a || true
          mkdir -p Dobby/include
          wget https://raw.githubusercontent.com/jmpews/Dobby/master/include/dobby.h -O Dobby/include/dobby.h

      - name: Build dylib
        run: |
          make clean || true
          make

      - uses: actions/upload-artifact@v4
        with:
          name: StandriseRage-dylib
          path: .theos/obj/arm64/StandriseRage.dylib
