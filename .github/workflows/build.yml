name: Get Original
on: [push, workflow_dispatch]

jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - name: Download
        run: wget https://github.com/surikjon2010-jpg/standrise-rag/releases/download/v1/LSTrial.dylib -O LSTrial.dylib
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Original_Dylib
          path: LSTrial.dylib
